spring.application.name=demo
spring.config.import=optional:classpath:application-secret.properties

# 내장 톰캣 포트 (기본 8080) - 포트 충돌 시 이 값을 변경한다.
server.port=${SERVER_PORT:8080}

# 개발 중 템플릿 캐시 해제 (수정 후 새로고침으로 바로 반영)
spring.thymeleaf.cache=false

# MySQL 연결 정보 - 계정과 비밀번호는 Git에서 제외한 secret 파일에 둔다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spring?serverTimezone=Asia/Seoul}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 로그인 상태 유지 기간. 운영 환경에서는 REMEMBER_ME_DURATION으로 덮어쓸 수 있다.
app.security.remember-me-duration=${REMEMBER_ME_DURATION:7d}

# 업로드 파일은 프로젝트 밖의 전용 폴더에 저장하고 요청 크기를 제한한다.
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

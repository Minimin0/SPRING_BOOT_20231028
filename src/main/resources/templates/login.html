<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 최민 포트폴리오</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/auth.css" rel="stylesheet">
    <link rel="icon" href="/images/profile.png">
</head>
<body>
<main class="auth-layout">
    <section class="auth-panel" aria-labelledby="login-title">
        <header class="auth-header">
            <img src="/images/profile.png" class="auth-avatar" alt="최민 프로필 이미지">
            <h1 id="login-title">로그인</h1>
        </header>
        <div class="auth-body">
            <div th:if="${param.error}" class="alert alert-danger" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</div>
            <div th:if="${param.signup}" class="alert alert-success" role="status">회원가입이 완료되었습니다. 로그인해 주세요.</div>
            <div th:if="${param.logout}" class="alert alert-success" role="status">로그아웃되었습니다.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">아이디</label>
                    <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <div class="form-check mb-4">
                    <input id="remember-me" name="remember-me" type="checkbox" class="form-check-input">
                    <label for="remember-me" class="form-check-label">로그인 상태 유지</label>
                </div>
                <button type="submit" class="btn auth-submit">로그인</button>
            </form>

            <div class="auth-links">
                <a th:href="@{/}">메인으로</a>
                <a th:href="@{/signup}">회원가입</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>

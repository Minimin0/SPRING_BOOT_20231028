<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 최민 포트폴리오</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/auth.css" rel="stylesheet">
    <link rel="icon" href="/images/profile.png">
</head>
<body>
<main class="auth-layout">
    <section class="auth-panel" aria-labelledby="signup-title">
        <header class="auth-header">
            <img src="/images/profile.png" class="auth-avatar" alt="최민 프로필 이미지">
            <h1 id="signup-title">회원가입</h1>
        </header>
        <div class="auth-body">
            <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>

            <form th:action="@{/signup}" th:object="${memberForm}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">아이디</label>
                    <input id="username" th:field="*{username}" type="text" class="form-control" maxlength="50" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">이름</label>
                    <input id="name" th:field="*{name}" type="text" class="form-control" maxlength="50" autocomplete="name" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input id="password" th:field="*{password}" type="password" class="form-control" minlength="6" autocomplete="new-password" required>
                </div>
                <div class="mb-4">
                    <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
                    <input id="passwordConfirm" th:field="*{passwordConfirm}" type="password" class="form-control" minlength="6" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn auth-submit">가입하기</button>
            </form>

            <div class="auth-links">
                <a th:href="@{/}">메인으로</a>
                <a th:href="@{/login}">로그인</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>

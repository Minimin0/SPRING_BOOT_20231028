<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터베이스 테스트</title>
    <style>
        body { font-family: sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; }
        caption { font-size: 28px; font-weight: 700; margin-bottom: 20px; text-align: left; }
        th, td { border: 1px solid #bbb; padding: 12px; text-align: center; }
        th { background: #f3f4f6; }
    </style>
</head>
<body>
<table>
    <caption>사용자 목록</caption>
    <thead>
    <tr>
        <th>아이디</th>
        <th>이름</th>
        <th>나이</th>
        <th>성별</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.age}"></td>
        <td th:text="${user.gender}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(users)}">
        <td colspan="4">등록된 사용자가 없습니다.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
